<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=6">
<style>
  html, body { margin: 0; padding: 0; background: #2a2a2a; -webkit-tap-highlight-color: transparent; }
  body.light { background: #e9e9ec; }
  body.sepia { background: #e8dcc4; }
  body.dark { background: #1b1b1d; }
  body.black { background: #000; }
  #pages { padding: 64px 0 90px; }
  .page { position: relative; margin: 0 auto 10px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .page canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  body.dark .page canvas, body.black .page canvas { filter: invert(.9) hue-rotate(180deg); }
  body.dark .page, body.black .page { background: #222; }
  body.sepia .page canvas { filter: sepia(.45) brightness(.97); }
  .num { position: absolute; bottom: -2px; right: 6px; font: 11px sans-serif; color: rgba(128,128,128,.8); }
  .textLayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; line-height: 1; opacity: 1;
               -webkit-text-size-adjust: none; text-size-adjust: none; transform-origin: 0 0; z-index: 2; }
  .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer ::selection { background: rgba(0, 110, 255, .30); }
  .textLayer .endOfContent { display: block; position: absolute; left: 0; top: 100%; right: 0; bottom: 0; z-index: -1; user-select: none; }
  mark.yr { color: transparent !important; border-radius: 2px; }
  mark.yr.c0 { background: rgba(255,214,0,.45); } mark.yr.c1 { background: rgba(90,200,120,.42); }
  mark.yr.c2 { background: rgba(80,160,255,.42); } mark.yr.c3 { background: rgba(255,105,150,.42); }
  mark.yr.n { border-bottom: 2px dotted #ff7a1a; }
  #msg { color: #aaa; font: 15px sans-serif; text-align: center; padding: 120px 30px; }
</style>
<script src="pdfjs/pdf.min.js"></script>
<script src="mark.js"></script>
</head>
<body class="dark">
<div id="msg">Opening…</div>
<div id="pages"></div>
<script src="pdf_view.js"></script>
</body>
</html>
